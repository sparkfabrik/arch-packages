[chatgpt-desktop]
source = "regex"
url = "https://persistent.oaistatic.com/codex-app-prod/linux/deb/dists/stable/main/binary-amd64/Packages"
regex = '(?ms)^Package: chatgpt\n(?:(?!\n\n).)*?^Version: ([0-9]+\.[0-9]+\.[0-9]+)$'

[voice-strip]
source = "github"
github = "paolomainardi/voice-strip"
use_latest_release = true
prefix = "v"

[herdr-core]
source = "regex"
url = "https://releases.herdr.dev/core/latest.json"
regex = '\A\{\s*"version"\s*:\s*"([0-9]+\.[0-9]+\.[0-9]+)"'
