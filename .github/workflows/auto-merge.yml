name: Merge verified version updates

on:
  workflow_run:
    workflows: [Build packages]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: merge-package-updates-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'chore/update-')
    runs-on: ubuntu-24.04
    environment: updates
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Create scoped automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.SF_PR_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.SF_PR_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Validate and merge the successful head
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECKS_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: python scripts/auto_merge.py
